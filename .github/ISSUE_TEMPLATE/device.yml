name: Device compatibility / Совместимость
description: Share the model and commands you actually tested.
title: "[Device] Manufacturer and model"
body:
  - type: input
    id: device
    attributes:
      label: Device manufacturer and model / Модель
      placeholder: Akenori LED-320 New
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Android version and Home Remote versions
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Wi-Fi receiver
        - Bluetooth HID
        - Classic ADB/TCP
  - type: textarea
    id: results
    attributes:
      label: What actually worked? / Что сработало?
      description: List navigation, volume and individual image controls. Separate connection success from actual device response.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed pairing codes, tokens, MAC/serial values and personal screen content.
          required: true
